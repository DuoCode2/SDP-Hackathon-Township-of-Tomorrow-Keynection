# Runs the two automated layers on every push and pull request (see docs/testing-overview.md):
#   1. the 339 server tests (pytest, SQLite per test, AI stand-in: nothing reaches Anthropic or Google)
#   2. the front-end build (TypeScript strict; a type error fails it)
# Same Python and Node majors as the team's laptops and the Dockerfile. It cannot stop Render deploying a
# broken push to main (Render deploys on commit), but it says within minutes that one went wrong.
# Machines: when the repository variable USE_DEPOT is 'true' the jobs run on Depot's
# Linux runners (depot-ubuntu-24.04, 2 CPU / 8 GB, about the size of GitHub's standard runner); otherwise on
# GitHub's ubuntu-latest. To go back to GitHub, delete the variable; no code change needed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Server tests (pytest)
    runs-on: ${{ vars.USE_DEPOT == 'true' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Web app build (TypeScript strict)
    runs-on: ${{ vars.USE_DEPOT == 'true' && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build
